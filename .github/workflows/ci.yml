name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test (pure pipeline — no network)
        run: npm run test:unit

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test (integration — downloads model once, ~5 MB)
        run: npm run test:integration
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"

  pack:
    runs-on: ubuntu-latest
    needs: [check, integration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Pack
        run: npm pack --dry-run
      - name: Verify tarball contents
        run: |
          tarball=$(npm pack --silent)
          for f in \
            "package/dist/index.js" \
            "package/dist/index.cjs" \
            "package/dist/index.d.ts" \
            "package/dist/cli.js" \
            "package/bin/ichkil.mjs"; do
            tar -tzf "$tarball" | grep -qx "$f" || { echo "missing: $f"; exit 1; }
          done
          echo "tarball OK: $tarball"
      - uses: actions/upload-artifact@v4
        with:
          name: ichkil-npm
          path: "*.tgz"
